<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Kỷ Niệm Cute</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --accent-blue: #bfe5f7;
            --font-title: 'Patrick Hand', cursive;
            --font-body: 'Fredoka', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .nav-btn {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: var(--accent-blue);
        }

        .month-year-selectors {
            display: flex;
            gap: 8px;
        }

        select {
            border: none;
            background: transparent;
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
        }

        .illustration {
            width: 110px;
            height: 110px;
            margin: 5px 0 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration svg {
            width: 100%;
            height: 100%;
        }

        .calendar-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-header {
            font-weight: 600;
            font-size: 14px;
            padding: 8px 0;
            color: #555;
            border-radius: 8px;
        }

        .day-header:first-child {
            background-color: var(--accent-blue);
            color: #2b5b75;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            user-select: none;
            overflow: visible;
            background-size: cover;
            background-position: center;
        }

        .day-cell:hover {
            transform: scale(1.08);
        }

        .day-cell.empty {
            cursor: default;
            background: transparent !important;
            transform: none;
        }

        .day-cell.today {
            border: 2px dashed #4aa3df;
        }

        .day-cell.has-photo {
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        .day-cell.has-photo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            z-index: 1;
        }

        .day-number {
            position: relative;
            z-index: 2;
            font-weight: bold;
        }

        .sticker-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 14px;
            z-index: 3;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-content h3 {
            font-family: var(--font-title);
            font-size: 22px;
            margin-bottom: 12px;
        }

        .upload-section {
            background: #f9f9f9;
            border: 2px dashed #ddd;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .file-label {
            display: inline-block;
            background: var(--accent-blue);
            color: #2b5b75;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .file-input {
            display: none;
        }

        .preview-img-box {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin: 6px auto 0 auto;
            object-fit: cover;
            display: none;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save { background: #8ed081; color: white; }
        .btn-cancel { background: #eee; }
        .btn-remove { background: #ffbebe; color: #900; }
        
        .footer-hint {
            margin-top: 15px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <div class="controls">
            <button class="nav-btn" id="prev-btn">❮</button>
            <div class="month-year-selectors">
                <select id="month-select"></select>
                <select id="year-select"></select>
            </div>
            <button class="nav-btn" id="next-btn">❯</button>
        </div>

        <div class="illustration" id="illustration-box"></div>

        <div class="calendar-grid" id="calendar-grid">
            <div class="day-header">S</div>
            <div class="day-header">M</div>
            <div class="day-header">T</div>
            <div class="day-header">W</div>
            <div class="day-header">T</div>
            <div class="day-header">F</div>
            <div class="day-header">S</div>
        </div>

        <div class="footer-hint">
            💡 Chạm vào ngày để thêm ảnh nền & sticker từ bàn phím!
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>Kỷ Niệm Ngày Này</h3>

            <div class="upload-section">
                <label for="photo-file" class="file-label">🖼️ Chọn ảnh từ thiết bị</label>
                <input type="file" id="photo-file" class="file-input" accept="image/*">
                <img id="preview-img" class="preview-img-box" alt="Preview">
            </div>

            <div class="input-group">
                <label>Nhập Sticker từ bàn phím (VD: ❤️, 🌸, ⭐):</label>
                <input type="text" id="sticker-input" placeholder="Gõ emoji bằng bàn phím...">
            </div>

            <div class="modal-btns">
                <button class="btn btn-save" onclick="saveMemory()">Lưu</button>
                <button class="btn btn-remove" onclick="removeMemory()">Xóa</button>
                <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>
