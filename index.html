<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Kỷ Niệm Cute</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --accent-blue: #bfe5f7;
            --font-title: 'Patrick Hand', cursive;
            --font-body: 'Fredoka', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Nút đăng nhập Google ở góc trên */
        .auth-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .google-btn {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 6px 12px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .user-greeting {
            font-weight: 600;
            color: #555;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .nav-btn {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: var(--accent-blue);
        }

        .month-year-selectors {
            display: flex;
            gap: 8px;
        }

        select {
            border: none;
            background: transparent;
            font-family: var(--font-title);
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
        }

        .illustration {
            width: 110px;
            height: 110px;
            margin: 5px 0 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration svg {
            width: 100%;
            height: 100%;
        }

        .calendar-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-header {
            font-weight: 600;
            font-size: 14px;
            padding: 8px 0;
            color: #555;
            border-radius: 8px;
        }

        .day-header:first-child {
            background-color: var(--accent-blue);
            color: #2b5b75;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            user-select: none;
            overflow: visible;
            background-size: cover;
            background-position: center;
        }

        .day-cell:hover {
            transform: scale(1.08);
        }

        .day-cell.empty {
            cursor: default;
            background: transparent !important;
            transform: none;
        }

        .day-cell.today {
            border: 2px dashed #4aa3df;
        }

        .day-cell.has-photo {
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        .day-cell.has-photo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            z-index: 1;
        }

        .day-number {
            position: relative;
            z-index: 2;
            font-weight: bold;
        }

        .sticker-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            font-size: 14px;
            z-index: 3;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-content h3 {
            font-family: var(--font-title);
            font-size: 22px;
            margin-bottom: 12px;
        }

        .upload-section {
            background: #f9f9f9;
            border: 2px dashed #ddd;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .file-label {
            display: inline-block;
            background: var(--accent-blue);
            color: #2b5b75;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .file-input {
            display: none;
        }

        .preview-img-box {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin: 6px auto 0 auto;
            object-fit: cover;
            display: none;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save { background: #8ed081; color: white; }
        .btn-cancel { background: #eee; }
        .btn-remove { background: #ffbebe; color: #900; }
        
        .footer-hint {
            margin-top: 15px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="calendar-card">
        <!-- Phần Đăng nhập Google -->
        <div class="auth-container">
            <button class="google-btn" id="google-login-btn" onclick="toggleGoogleLogin()">
                🌐 Đăng nhập Google
            </button>
            <span class="user-greeting" id="user-greeting"></span>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prev-btn">❮</button>
            <div class="month-year-selectors">
                <select id="month-select"></select>
                <select id="year-select"></select>
            </div>
            <button class="nav-btn" id="next-btn">❯</button>
        </div>

        <div class="illustration" id="illustration-box"></div>

        <div class="calendar-grid" id="calendar-grid">
            <div class="day-header">S</div>
            <div class="day-header">M</div>
            <div class="day-header">T</div>
            <div class="day-header">W</div>
            <div class="day-header">T</div>
            <div class="day-header">F</div>
            <div class="day-header">S</div>
        </div>

        <div class="footer-hint">
            💡 Chạm vào ngày để thêm ảnh nền & sticker từ bàn phím!
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>Kỷ Niệm Ngày Này</h3>

            <div class="upload-section">
                <label for="photo-file" class="file-label">🖼️ Chọn ảnh từ thiết bị</label>
                <input type="file" id="photo-file" class="file-input" accept="image/*">
                <img id="preview-img" class="preview-img-box" alt="Preview">
            </div>

            <div class="input-group">
                <label>Nhập Sticker từ bàn phím (VD: ❤️, 🌸, ⭐):</label>
                <input type="text" id="sticker-input" placeholder="Gõ emoji bằng bàn phím...">
            </div>

            <div class="modal-btns">
                <button class="btn btn-save" onclick="saveMemory()">Lưu</button>
                <button class="btn btn-remove" onclick="removeMemory()">Xóa</button>
                <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Logic Đồng bộ Cloud -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBSf4UCMdLsZMHwbC3KZ30gDeVgn5-dx2E",
          authDomain: "linhkiniem-1234.firebaseapp.com",
          projectId: "linhkiniem-1234",
          storageBucket: "linhkiniem-1234.firebasestorage.app",
          messagingSenderId: "1028016727680",
          appId: "1:1028016727680:web:04de2d34cc7d21aa71a865"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        window.toggleGoogleLogin = async function() {
            if (!currentUser) {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Lỗi đăng nhập:", error);
                    alert("Đăng nhập thất bại: " + error.message);
                }
            } else {
                try {
                    await signOut(auth);
                    alert("Đã đăng xuất tài khoản!");
                } catch (error) {
                    console.error("Lỗi đăng xuất:", error);
                }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById("google-login-btn");
            const greeting = document.getElementById("user-greeting");

            if (user) {
                currentUser = user;
                loginBtn.textContent = "🚪 Đăng xuất";
                greeting.textContent = "Hi, " + user.displayName;

                // Tải dữ liệu từ Firestore Cloud về
                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        memoryData = docSnap.data().memories || {};
                        localStorage.setItem("calendar_memories_v8", JSON.stringify(memoryData));
                        renderCalendar();
                    }
                } catch (e) {
                    console.error("Lỗi tải dữ liệu đám mây:", e);
                }
            } else {
                currentUser = null;
                loginBtn.innerHTML = "🌐 Đăng nhập Google";
                greeting.textContent = "";
            }
        });

        window.saveToCloud = async function(data) {
            if (currentUser) {
                try {
                    await setDoc(doc(db, "users", currentUser.uid), { memories: data });
                } catch (e) {
                    console.error("Lỗi lưu đám mây: ", e);
                }
            }
        };
    </script>

    <script>
        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        
        const svgs = [
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#fbd2d7"/><circle cx="40" cy="45" r="4" fill="#333"/><circle cx="60" cy="45" r="4" fill="#333"/><path d="M 45 55 Q 50 60 55 55" stroke="#333" stroke-width="3" fill="none"/><ellipse cx="30" cy="35" rx="8" ry="15" fill="#e8a2a8"/><ellipse cx="70" cy="35" rx="8" ry="15" fill="#e8a2a8"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#e3f2fd"/><circle cx="40" cy="45" r="4" fill="#333"/><circle cx="60" cy="45" r="4" fill="#333"/><path d="M 45 55 Q 50 62 55 55" stroke="#333" stroke-width="3" fill="none"/><path d="M 35 25 Q 50 15 65 25 Q 50 30 35 25" fill="#90caf9"/></svg>`,
            `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#fff9c4"/><circle cx="40" cy="45" r="4" fill="#333"/><circle cx="60" cy="45" r="4" fill="#333"/><ellipse cx="50" cy="52" rx="5" ry="3" fill="#ffb74d"/><path d="M 35 20 L 45 30 L 30 35 Z" fill="#fff176"/><path d="M 65 20 L 55 30 L 70 35 Z" fill="#fff176"/></svg>`
        ];

        let currentDate = new Date();
        let selectedDayKey = "";
        let memoryData = JSON.parse(localStorage.getItem("calendar_memories_v8") || "{}");
        let tempPhoto = "";

        const monthSelect = document.getElementById("month-select");
        const yearSelect = document.getElementById("year-select");
        const calendarGrid = document.getElementById("calendar-grid");
        const illustrationBox = document.getElementById("illustration-box");
        const modal = document.getElementById("modal");
        const photoFileInput = document.getElementById("photo-file");
        const previewImg = document.getElementById("preview-img");
        const stickerInput = document.getElementById("sticker-input");

        monthNames.forEach((m, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = m;
            monthSelect.appendChild(opt);
        });

        for (let y = 2020; y <= 2030; y++) {
            const opt = document.createElement("option");
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        photoFileInput.addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const MAX_HEIGHT = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        tempPhoto = canvas.toDataURL('image/jpeg', 0.7);
                        previewImg.src = tempPhoto;
                        previewImg.style.display = "block";
                    }
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthSelect.value = month;
            yearSelect.value = year;

            illustrationBox.innerHTML = svgs[month % svgs.length];

            const oldDays = calendarGrid.querySelectorAll(".day-cell");
            oldDays.forEach(d => d.remove());

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "day-cell empty";
                calendarGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.className = "day-cell";
                
                const numSpan = document.createElement("span");
                numSpan.className = "day-number";
                numSpan.textContent = day;
                cell.appendChild(numSpan);

                const dayKey = `${year}-${month + 1}-${day}`;

                if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
                    cell.classList.add("today");
                }

                const item = memoryData[dayKey];
                if (item) {
                    if (item.photo) {
                        cell.style.backgroundImage = `url('${item.photo}')`;
                        cell.classList.add("has-photo");
                    }
                    if (item.sticker) {
                        const badge = document.createElement("div");
                        badge.className = "sticker-badge";
                        badge.textContent = item.sticker;
                        cell.appendChild(badge);
                    }
                }

                cell.onclick = () => openModal(dayKey);
                calendarGrid.appendChild(cell);
            }
        }

        function openModal(key) {
            selectedDayKey = key;
            const item = memoryData[key] || {};
            
            tempPhoto = item.photo || "";
            stickerInput.value = item.sticker || "";

            if (tempPhoto) {
                previewImg.src = tempPhoto;
                previewImg.style.display = "block";
            } else {
                previewImg.style.display = "none";
            }

            photoFileInput.value = "";
            modal.classList.add("active");
        }

        function closeModal() {
            modal.classList.remove("active");
        }

        function saveMemory() {
            const stickerVal = stickerInput.value.trim();
            if (tempPhoto || stickerVal) {
                memoryData[selectedDayKey] = {
                    photo: tempPhoto,
                    sticker: stickerVal
                };
            } else {
                delete memoryData[selectedDayKey];
            }
            saveAndRender();
        }

        function removeMemory() {
            delete memoryData[selectedDayKey];
            saveAndRender();
        }

        function saveAndRender() {
            try {
                localStorage.setItem("calendar_memories_v8", JSON.stringify(memoryData));
                if (typeof window.saveToCloud === 'function') {
                    window.saveToCloud(memoryData);
                }
            } catch (e) {
                alert("Bộ nhớ đã đầy, vui lòng chọn ảnh dung lượng nhẹ hơn!");
                return;
            }
            closeModal();
            renderCalendar();
        }

        document.getElementById("prev-btn").onclick = () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        };

        document.getElementById("next-btn").onclick = () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        };

        monthSelect.onchange = (e) => {
            currentDate.setMonth(parseInt(e.target.value));
            renderCalendar();
        };

        yearSelect.onchange = (e) => {
            currentDate.setFullYear(parseInt(e.target.value));
            renderCalendar();
        };

        renderCalendar();
    </script>
</body>
</html>
