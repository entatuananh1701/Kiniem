<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Lịch Kỷ Niệm Cute</title>

        :root {

            --card-bg: #ffffff;

            --accent-hover: #9bd6f3;

            color: var(--text-main);

            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

            border-radius: 24px;
            width: 100%;

            padding: 24px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }
